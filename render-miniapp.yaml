services:
  - type: web
    name: waifu-catcher-miniapp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn miniapp.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_NAME
        value: waifu_bot
